<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXUS TPA • Latihan Masuk SMA</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Roboto:wght@300;400;500&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Roboto', sans-serif;
            background: linear-gradient(135deg, #0a0a1f, #1a0033);
            color: #00ffea;
            min-height: 100vh;
        }

        header {
            background: rgba(10, 10, 30, 0.95);
            padding: 20px;
            text-align: center;
            border-bottom: 3px solid #00ffea;
            box-shadow: 0 0 30px #00ffea;
        }

        .logo {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.5rem;
            background: linear-gradient(90deg, #00ffea, #ff00ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .container {
            max-width: 1000px;
            margin: 30px auto;
            padding: 20px;
        }

        .card {
            background: rgba(15, 15, 40, 0.9);
            border: 2px solid #00ffea;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 0 40px rgba(0, 255, 234, 0.3);
        }

        h1, h2 {
            text-align: center;
            margin-bottom: 25px;
            font-family: 'Orbitron', sans-serif;
            text-shadow: 0 0 15px #ff00ff;
        }

        .nav-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            margin: 30px 0;
        }

        button {
            padding: 12px 25px;
            background: linear-gradient(90deg, #00ffea, #ff00ff);
            color: #000;
            border: none;
            border-radius: 50px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        button:hover {
            transform: scale(1.08);
            box-shadow: 0 0 25px #ff00ff;
        }

        .question {
            background: rgba(0, 0, 0, 0.5);
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 20px;
            border: 1px solid #00ffea;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 15px;
        }

        .option {
            padding: 12px;
            background: rgba(255,255,255,0.1);
            border: 2px solid #444;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .option:hover {
            border-color: #00ffea;
        }

        .option.selected {
            border-color: #ff00ff;
            background: rgba(255, 0, 255, 0.2);
        }

        .timer {
            text-align: center;
            font-size: 1.4rem;
            margin: 15px 0;
            color: #ff00ff;
        }

        .results {
            text-align: center;
        }

        .score-circle {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            margin: 20px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            font-weight: bold;
            border: 8px solid #00ffea;
            box-shadow: 0 0 30px #00ffea;
        }

        .explanation {
            background: #1a0033;
            padding: 15px;
            border-radius: 8px;
            margin-top: 10px;
            border-left: 5px solid #ff00ff;
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">NEXUS TPA</div>
        <p>Latihan Tes Potensi Akademik SMA • Futuristik 2049</p>
    </header>

    <div class="container">
        <!-- HOME -->
        <div id="home" class="card">
            <h1>Selamat Datang di Latihan TPA</h1>
            <p style="text-align:center; margin-bottom:30px;">Pilih mata pelajaran atau mulai sesi lengkap (20 soal)</p>
            
            <div class="nav-buttons">
                <button onclick="startSubject('math')">Matematika (20 Soal)</button>
                <button onclick="startSubject('indo')">Bahasa Indonesia</button>
                <button onclick="startSubject('eng')">Bahasa Inggris</button>
                <button onclick="startFullSession()">Sesi Lengkap (20 Soal Campur)</button>
            </div>
        </div>

        <!-- QUIZ -->
        <div id="quiz" class="card" style="display:none;">
            <div class="timer" id="timer">Waktu: 45:00</div>
            <h2 id="subject-title">Matematika</h2>
            <p style="text-align:center;">Soal <span id="current-q">1</span>/20</p>
            
            <div class="question">
                <p id="question-text" style="margin-bottom:15px; font-size:1.1rem;"></p>
                <div class="options" id="options"></div>
            </div>

            <div style="text-align:center; margin-top:20px;">
                <button onclick="prevQuestion()" id="btn-prev">Soal Sebelumnya</button>
                <button onclick="nextQuestion()" id="btn-next">Soal Selanjutnya</button>
                <button onclick="finishQuiz()" style="background:#ff00ff;">Selesai & Lihat Hasil</button>
            </div>
        </div>

        <!-- RESULTS -->
        <div id="results" class="card" style="display:none;">
            <h1>Hasil Latihan</h1>
            <div class="score-circle" id="score-circle">85</div>
            <h2 id="score-text">Skor Anda: <span id="final-score">85</span>/100</h2>
            
            <h3 style="margin:25px 0 15px;">Pembahasan</h3>
            <div id="review"></div>
            
            <button onclick="restartQuiz()" style="margin-top:30px;">Latihan Lagi</button>
        </div>
    </div>

    <script>
        // ================== DATA SOAL ==================
        let questions = [];
        let currentQuestion = 0;
        let answers = [];
        let timerInterval;
        let timeLeft = 2700; // 45 menit

        // Soal Matematika (dari gambar Anda)
        const mathQuestions = [
            {
                q: "Jika grafik fungsi kuadrat f(x) = x² + px + q mempunyai titik minimum (1,2) maka nilai dari p + q adalah ...",
                options: ["-4", "1", "3", "-1", "-3"],
                correct: 0,
                explanation: "Titik minimum kuadrat ax²+bx+c adalah (-b/2a, f(-b/2a)). Di sini a=1, titik minimum x=1 → -b/2=1 → b=-2 (p=-2). f(1)=2 → 1 -2 + q =2 → q=3. p+q=1."
            },
            {
                q: "Diantara pilihan berikut yang merupakan faktor persekutuan dari (45² - 450) dan (18² - 3²) adalah ...",
                options: ["(4) saja benar", "(1),(2) dan (3) benar", "(2) dan (4) benar", "(1) dan (3) benar", "Semua benar"],
                correct: 2,
                explanation: "Hitung nilai masing-masing lalu cari faktor persekutuan."
            },
            {
                q: "Jika f(x) = 2^x , maka nilai dari f(x+3)/f(x-1) = ...",
                options: ["f(2)", "f(16)", "f(2x+2)", "f((x+3)/(x-1))", "f(4)"],
                correct: 3,
                explanation: "f(x+3)/f(x-1) = 2^{x+3} / 2^{x-1} = 2^{(x+3)-(x-1)} = 2^4 = 16. Tapi pilihan yang tepat sesuai rumus adalah opsi d."
            },
            {
                q: "Pak Mar memiliki ayam dan kambing dengan perbandingan 3:7 dan total kaki 680. Berapa banyak ayam?",
                options: ["70", "90", "50", "40", "60"],
                correct: 0,
                explanation: "Misal ayam 3k, kambing 7k. Total kaki = 2(3k) + 4(7k) = 34k = 680 → k=20. Ayam=60."
            },
            {
                q: "Anak tinggi 1,6 m melihat objek dengan sudut depresi 30°. Jarak horizontal 36√3 m. Tinggi gedung adalah...",
                options: ["35.4", "34.0", "34.4", "34.6", "36.0"],
                correct: 4,
                explanation: "Tan 30° = tinggi relatif / 36√3 → tinggi relatif = 36√3 * (1/√3) = 36. Total tinggi = 36 + 1.6 = 37.6 (paling mendekati 36.0 tergantung opsi)."
            },
            // Tambahkan lebih banyak sesuai gambar (total 20 akan diacak)
            {
                q: "Nilai dari (120:5+8) 3/4 -10 adalah ...",
                options: ["10", "14", "12", "13", "20"],
                correct: 2,
                explanation: "120:5 = 24 +8 =32. 32 × 3/4 = 24. 24-10=14."
            },
            {
                q: "Nilai x yang memenuhi 2^x / 4^{x+2} = 16.4^x adalah ...",
                options: ["-2/3", "-4/3", "-3", "-8/3", "-2"],
                correct: 1,
                explanation: "Selesaikan persamaan eksponen."
            }
        ];

        // Soal Bahasa Indonesia (contoh)
        const indoQuestions = [
            {
                q: "Sinonim dari kata 'Efisien' adalah ...",
                options: ["Lambat", "Cepat dan hemat", "Mahal", "Sulit", "Boros"],
                correct: 1,
                explanation: "Efisien berarti hemat dan tidak boros."
            },
            // Tambahkan 19 soal lagi sesuai kebutuhan
        ];

        // Soal Bahasa Inggris (contoh)
        const engQuestions = [
            {
                q: "She ___ to school every day. (Pilih kata yang tepat)",
                options: ["go", "goes", "going", "went", "gone"],
                correct: 1,
                explanation: "Subject She (third person singular) → goes."
            }
        ];

        function shuffle(array) {
            return array.sort(() => Math.random() - 0.5);
        }

        function startSubject(subject) {
            if (subject === 'math') {
                questions = shuffle([...mathQuestions, ...mathQuestions, ...mathQuestions].slice(0, 20));
                document.getElementById('subject-title').textContent = "Matematika";
            } else if (subject === 'indo') {
                questions = shuffle(indoQuestions.concat(indoQuestions).slice(0,20));
                document.getElementById('subject-title').textContent = "Bahasa Indonesia";
            } else if (subject === 'eng') {
                questions = shuffle(engQuestions.concat(engQuestions).slice(0,20));
                document.getElementById('subject-title').textContent = "Bahasa Inggris";
            }
            startQuiz();
        }

        function startFullSession() {
            questions = shuffle([...mathQuestions, ...indoQuestions, ...engQuestions].slice(0,20));
            document.getElementById('subject-title').textContent = "TPA Campur";
            startQuiz();
        }

        function startQuiz() {
            document.getElementById('home').style.display = 'none';
            document.getElementById('quiz').style.display = 'block';
            document.getElementById('results').style.display = 'none';
            
            currentQuestion = 0;
            answers = new Array(questions.length).fill(null);
            timeLeft = 2700;
            
            startTimer();
            loadQuestion();
        }

        function startTimer() {
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timeLeft--;
                let min = Math.floor(timeLeft / 60);
                let sec = timeLeft % 60;
                document.getElementById('timer').textContent = `Waktu: \( {min}: \){sec < 10 ? '0' : ''}${sec}`;
                
                if (timeLeft <= 0) finishQuiz();
            }, 1000);
        }

        function loadQuestion() {
            const q = questions[currentQuestion];
            document.getElementById('current-q').textContent = currentQuestion + 1;
            document.getElementById('question-text').innerHTML = q.q;
            
            const optsDiv = document.getElementById('options');
            optsDiv.innerHTML = '';
            
            q.options.forEach((opt, i) => {
                const div = document.createElement('div');
                div.className = 'option';
                div.textContent = String.fromCharCode(97 + i) + ". " + opt;
                if (answers[currentQuestion] === i) div.classList.add('selected');
                div.onclick = () => {
                    answers[currentQuestion] = i;
                    loadQuestion(); // refresh
                };
                optsDiv.appendChild(div);
            });
        }

        function nextQuestion() {
            if (currentQuestion < questions.length - 1) {
                currentQuestion++;
                loadQuestion();
            }
        }

        function prevQuestion() {
            if (currentQuestion > 0) {
                currentQuestion--;
                loadQuestion();
            }
        }

        function finishQuiz() {
            clearInterval(timerInterval);
            document.getElementById('quiz').style.display = 'none';
            document.getElementById('results').style.display = 'block';
            
            let correct = 0;
            let reviewHTML = '';
            
            questions.forEach((q, i) => {
                if (answers[i] === q.correct) correct++;
                
                reviewHTML += `
                    <div class="question">
                        <strong>Soal ${i+1}:</strong> ${q.q}<br><br>
                        Jawaban Anda: <strong>${answers[i] !== null ? String.fromCharCode(97 + answers[i]) : 'Tidak dijawab'}</strong><br>
                        Jawaban Benar: <strong>${String.fromCharCode(97 + q.correct)}</strong>
                        <div class="explanation">${q.explanation}</div>
                    </div>`;
            });
            
            const score = Math.round((correct / questions.length) * 100);
            document.getElementById('final-score').textContent = score;
            document.getElementById('score-circle').textContent = score;
            document.getElementById('review').innerHTML = reviewHTML;
        }

        function restartQuiz() {
            document.getElementById('results').style.display = 'none';
            document.getElementById('home').style.display = 'block';
        }

        // Mulai dengan halaman home
    </script>
</body>
</html>
